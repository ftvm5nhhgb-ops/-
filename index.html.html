<script>

 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function preferences(){
  if(window.V204Feedback?.preferences)return window.V204Feedback.preferences();

  safely(()=>{let host=document.getElementById('cityToastStack');if(!host){host=document.createElement('div');host.id='cityToastStack';host.className='cityToastStack';host.setAttribute('role','status');host.setAttribute('aria-live','polite');document.body.appendChild(host)}

   if(host.lastElementChild?.textContent===message)return;const e=document.createElement('div');e.className='cityToast'+(kind==='warning'?' danger':'');e.textContent=message;host.appendChild(e);while(host.children.length>3)host.firstElementChild.remove();setTimeout(()=>e.remove(),3000);
  });return false;
 }

  if(!v188CampaignEnabled())return null;const svg=document.querySelector('#interactiveJapanMap svg');if(!svg)return null;
  const selected=id||v200Selected()||S.citySelected||(preserveSelection&&remembered?.state===S?remembered.selected:null);
  remembered={state:S,selected:CITY_DATA[selected]&&cityOwner(selected)===v188PlayerFaction()?selected:null,box:{...mapBox(svg)}};return remembered;
 })}

  if(!v188CampaignEnabled())return null;
  const view=v191State().view;if(['map','mapIdle','city'].includes(view)||remembered?.state!==S)return rememberMap();

  const svg=document.querySelector('#interactiveJapanMap svg');return {...remembered,box:svg?{...mapBox(svg)}:remembered.box};

  if(!v188CampaignEnabled()||S.v188.ending)return false;

  else {v200ClearMap();S.citySelected=null;v191State().view='mapIdle';paintMap();queueCitySymbols();window.V212UI?.dock(null)}
  const svg=document.querySelector('#interactiveJapanMap svg');if(svg&&saved?.box)setMapBox(svg,saved.box);
  closeCityPicker();if(typeof v190CloseSide==='function')v190CloseSide();rememberMap();return true;
 })}

  const el=document.createElement('section');el.id='v211Summary';el.className='v211Summary'+(warning?' warning':'');el.setAttribute('role','status');el.setAttribute('aria-live',warning?'assertive':'polite');
  el.innerHTML=`<div><b>${esc(title)}</b><p>${esc(text)}</p></div><div class="v211SummaryActions"><button type="button" class="v211Detail">${detail==='week'?'週次報告':'戦闘詳細'}</button><button type="button" aria-label="通知を閉じる">×</button></div>`;
  const buttons=el.querySelectorAll('button');buttons[0].onclick=()=>{dismissSummary();if(detail==='week')v191ShowWeekReport();else showLastBattle()};buttons[1].onclick=dismissSummary;area.appendChild(el);
  // Urgent losses stay visible until read; ordinary summaries leave the map free.
  if(!warning)summaryTimer=setTimeout(dismissSummary,7000);
 })}
 function weekSummary(report){if(!report)return;if(report.lost.length||report.cut.length)safely(()=>window.setGameSpeed?.(1));const names=(report.lost||[]).slice(0,3).map(id=>CITY_DATA[id]?.name||id).join('・');
  summary(`第${report.week}週　確保＋${report.gained.length}／失陥${report.lost.length}`,
   `${names?'失陥：'+names+'。 ':''}増援＋${v191Count(report.gain)} · 到着${report.arrivals.filter(a=>a.status==='arrival').length}件 · 補給断絶${report.cut.length}都市${report.offers.length?' · 外交提案'+report.offers.length+'件':''}`,'week',report.lost.length>0||report.cut.length>0);
 }

  const selected=r.captured?r.to:r.from;resumeMap(saved,selected);
  const outcome=r.tactic==='feint'?'牽制完了':r.captured?'都市制圧':r.breakthrough?'防衛線突破':'攻撃終了';
  summary(`${CITY_DATA[r.to].name}：${outcome}`,`味方損害 ${v191Count(r.attackerLoss)} · 敵損害 ${v191Count((r.defenderLoss||0)+(r.retreatLoss||0))}${r.defenseAfter!=null?' · 防衛度 残り'+Math.round(r.defenseAfter):''}`,'battle');

  if(!d||!CITY_DATA[d.from]||!CITY_DATA[d.to])return '攻撃先を選び直してください。';
  if(!v188CampaignEnabled()||S.v188.ending)return '戦役は終了しています。';
  if(V196_TURN_BUSY||document.body.classList.contains('v204TurnBusy'))return '週の処理が終わるまでお待ちください。';

  if(v173Army(d.from)<11000)return `兵力が${v191Count(v173Army(d.from))}です。攻撃には11,000人以上が必要です。`;

  const army=v173Army(from),battle=v197BattleUsed(from),moved=v197MoveUsed(from);

  const move=moved?'今週の移動を使用済み。次週に回復します。':Math.floor(Math.max(0,army-3000)*.75)<4000?'派遣できる兵力が不足。守備3,000人と派遣4,000人以上が必要です。':!v200Targets('move').length?'街道で接続する移動先の自国都市がありません。':'';
  return {attack,move};

  document.body.classList.toggle('v211Busy',on);
  for(const b of document.querySelectorAll('button'))if(/nextTurn\(|V211Comfort.endWeek\(|v199WeekPreview\(/.test(b.getAttribute('onclick')||'')){
   if(on){if(b.dataset.v211Label!==undefined)continue;b.dataset.v211Label=b.textContent;b.dataset.v211Disabled=String(b.disabled);b.disabled=true;b.setAttribute('aria-busy','true');b.textContent='処理中…'}
   else if(b.dataset.v211Label!==undefined){b.textContent=b.dataset.v211Label;b.disabled=b.dataset.v211Disabled==='true';delete b.dataset.v211Label;delete b.dataset.v211Disabled;b.removeAttribute('aria-busy')}

})();

function v201SetupProblem(){const x=V201_SETUP,r=v201SetupRelations();if(x.kind==='simulation'||x.diplomacy)return '';const others=Object.keys(factions).filter(f=>f!==x.player);if(x.win==='solo'&&others.some(f=>r[v178Pair(x.player,f)]==='allied'))return '自国だけの全国制覇には同盟からの離脱が必要です。外交を有効にするか、勝利条件を同盟陣営の制覇に変更してください。';return others.some(f=>!['war','allied'].includes(r[v178Pair(x.player,f)]))?'中立・友好・停戦の相手には攻撃できず、関係を固定すると全国制覇できません。外交を有効にするか、同盟以外の国を交戦にしてください。':''}

function v201DiplomacyScore(f,type){
 const p=v188PlayerFaction(),r=v178Relation(p,f),ratio=v178TotalArmy(p)/Math.max(1,v178TotalArmy(f)),fs=Object.keys(factions),shared=fs.some(e=>v178AtWar(p,e)&&v178AtWar(f,e)),fronts=fs.filter(e=>v178AtWar(f,e)).length;
 let score=type==='ally'?35:35,reasons=[];
 if(r.kind==='friendly'){score+=25;reasons.push('友好関係')}
 if(r.kind==='truce'){score+=15;reasons.push('停戦中')}
 if(type==='ally'&&r.kind==='war'){score-=20;reasons.push('自国と交戦中')}
 if(shared){score+=20;reasons.push('共通の敵が存在')}
 if(fronts>=2){score+=15;reasons.push('相手が多方面で交戦')}
 if(ratio>=1.2){score+=10;reasons.push('自国の戦力が上回る')}else if(ratio<.65){score-=15;reasons.push('相手との戦力差が大きい')}
 if(type==='truce'&&(r.losses||0)>=50000){score+=15;reasons.push('両国の戦争損失が大きい')}
 if(v201FreeState().history.some(h=>h.f===f&&h.type==='leave'&&S.t-h.week<12)){score-=25;reasons.push('最近の同盟離脱')}
 return {score:Math.max(5,Math.min(95,score)),label:score>=65?'応じやすい':score>=45?'慎重':'厳しい',reasons};
}
function v201AllianceCheck(f){
 const p=v188PlayerFaction();if(!v201DipAllowed()||!factions[f]||f===p||!v178Owned(f).length)return {ok:false,reason:'交渉対象外'};
 if(v173AreAllied(p,f))return {ok:false,reason:'すでに同盟国です'};
 const union=Object.keys(factions).filter(x=>v173AreAllied(p,x)||v173AreAllied(f,x));
 const conflict=Object.keys(factions).some(e=>!union.includes(e)&&union.some(a=>v178AtWar(a,e))&&union.some(a=>{const r=v178Relation(a,e);return r.kind==='truce'&&r.until>S.t}));
 if(conflict)return {ok:false,reason:'共同戦線と既存の停戦条約が衝突します。停戦満了を待ってください。'};

 if(x.pending.some(o=>o.f===f)||x.cooldowns[key]>S.t)return false;

function v201ResolveDiplomacy(){
 if(!v188CampaignEnabled()||v196Mode()!=='free')return;
 const x=v201FreeState();if(!x.diplomacy||x.lastWeek===S.t)return;x.lastWeek=S.t;
 for(const o of [...x.pending]){
  if(o.due>S.t)continue;const p=v188PlayerFaction(),r=v178Relation(p,o.f),pred=v201DiplomacyScore(o.f,o.type);
  let accepted=false,text='';
  if(!v178Owned(o.f).length)text='相手国が領土を失ったため交渉終了。';
  else if(o.type==='ally'&&r.kind==='allied'){accepted=true;text='すでに同盟が成立しています。'}
  else if(o.type==='truce'&&r.kind!=='war')text='交戦状態が解消されたため打診を終了。';
  else {
   const check=o.type==='ally'?v201AllianceCheck(o.f):{ok:true},threshold=o.type==='ally'?60:55,jitter=Math.floor(v178Rand(`${o.week}|talk|${o.key}`)*21)-10;
   if(check.ok&&pred.score+jitter>=threshold){accepted=o.type==='ally'?v191FormAlliance(o.f):v178BlocTruce(p,o.f,'プレイヤーの停戦打診を受けて合意。',12);text=accepted?(o.type==='ally'?'同盟が成立しました。':'12週間の停戦が成立しました。'):'戦況の変化により成立しませんでした。'}
   else text=check.ok?'相手国が提案を拒否。関係・国力・戦況から協力の利点が不足しました。':check.reason;
  }
  x.history.unshift({week:S.t,type:o.type,f:o.f,accepted,text});x.history=x.history.slice(0,30);x.pending=x.pending.filter(a=>a!==o);
  v178Event('diplomacyReply',`${o.f}：${text}`,{a:p,b:o.f});log(`【外交回答】${o.f}：${text}`);
 }
 v191State().offers=v191State().offers.filter(o=>o.until>S.t&&v178Owned(o.f).length&&(o.type==='ally'?!v173AreAllied(v188PlayerFaction(),o.f):v178AtWar(v188PlayerFaction(),o.f)));
 // One understandable incoming proposal every third week; no treaty binds the player without an answer.
 if(S.t%3===0&&v191State().offers.filter(o=>o.until>S.t).length<2){
  const p=v188PlayerFaction(),candidates=Object.keys(factions).filter(f=>f!==p&&v178Owned(f).length&&!v173AreAllied(p,f)&&!x.pending.some(o=>o.f===f)).map(f=>{
   const a=v201DiplomacyScore(f,'ally'),peace=v201DiplomacyScore(f,'truce'),type=v201AllianceCheck(f).ok&&a.score>=65?'ally':v178AtWar(p,f)&&peace.score>=55?'truce':null;
   return {f,type,score:type==='ally'?a.score:peace.score,reasons:(type==='ally'?a:peace).reasons};
  }).filter(c=>c.type&&!(v191State().declined[c.type+'|'+c.f]>S.t)&&!v191State().offers.some(o=>o.f===c.f&&o.type===c.type&&o.until>S.t)).sort((a,b)=>b.score-a.score);
  if(candidates[0]){const c=candidates[0];v191OfferDiplomacy(c.type,c.f,c.reasons.join('・')||'戦線安定のための協力を希望。',12)}
 }
}

 if(!from||V200_MAP.mode!=='moveConfirm'||!v200Targets('move').includes(to)){V200_MAP.message='命令条件が変わりました。行き先を選び直してください。';v200RenderMapCommand();return false}

 if(amount<4000){V200_MAP.message='派遣には4,000人以上が必要です。投入率を上げてください。';v200RenderMapCommand();return false}
 // Reuse the authoritative move controller; do not consume the separate battle allowance.
 const result=v194IssueMove(from,to,pct,false);if(!result)return false;
 v200Select(same?to:from,same);
 V200_MAP.message=`${CITY_DATA[from].name} → ${CITY_DATA[to].name}：${v191Count(amount)}を${same?'移動しました。移動先で攻撃できます。':`派遣しました。第${result.due}週到着予定。行軍中の兵は攻撃に参加できません。`}`;

 v200RenderMapCommand();v191Autosave();return result;
}

function v199Candidates(){
 const p=v188PlayerFaction(),list=[];
 for(const from of v178Fronts(p))for(const to of CITY_DATA[from].neighbors){
  if(!v178CanAttackCity(from,to))continue;
  const pred=v191Predict(from,to,.6,'assault');if(!pred)continue;
  list.push({from,to,pred,ready:v197CanBattle(from)&&pred.army>=11000,sup:v177IsSupplied(from,p)});
 }
 return list.sort((a,b)=>Number(b.ready)-Number(a.ready)||Number(b.sup)-Number(a.sup)||b.pred.ratio-a.pred.ratio);
}

function adjacentOwn(c){
 const connected=new Set(ADJ[+c]||[]);
 for(const city of Object.values(CITY_DATA))if(city.pref===+c)for(const next of city.neighbors)connected.add(CITY_DATA[next].pref);
 return [...connected].filter(n=>n!==+c&&owner(n)==="東海帝国");
}
function sortieSource(target,preferred,manual){
 const sources=adjacentOwn(target);
 if(manual&&sources.includes(+preferred))return +preferred;
 const ready=sources.filter(c=>unitDefs.some(u=>u.pref===c&&u.str>0&&!(S.moves||[]).some(m=>m.unit===u.id)));
 return ready.includes(+preferred)?+preferred:ready[0]||(sources.includes(+preferred)?+preferred:sources[0]);
}
function threatHTML(){
 const t=ensureWar().threat;if(!t)return"";
 return `<div class="panel objective"><b>関東軍侵攻予告：${names[t.from]} → ${names[t.to]}</b><p class=muted>推定侵攻兵力 ${intel(S.e[t.from])}。${names[t.to]}の守備軍 ${(S.r[t.to]||0)+(S.g[t.to]||0)}人。今週中に防衛方針を決めてください。未選択なら次週開始時に迎撃します。</p><div class=actions><button onclick="resolveThreat('intercept')">迎撃</button><button onclick="resolveThreat('fortify')">要塞防衛</button><button onclick="resolveThreat('retreat')">撤退</button></div></div>`;
}
function resolveThreat(mode){
 const w=ensureWar(),t=w.threat;if(!t)return;
 const defenders=unitDefs.filter(u=>u.pref===t.to&&u.str>0&&!(S.moves||[]).some(m=>m.unit===u.id));
 const total=defenders.reduce((n,u)=>n+u.str,0),fort=S.development?.[t.to]?.defense||0;
 const defense=defenders.reduce((n,u)=>n+u.str*UNIT_SPECS[u.spec||"inf"].def,0)*(mode==="fortify"?1.35:1.12)*(1+Math.min(5,fort)*.12)*armyBonus(defenders);
 const attack=t.force*(.94+Math.random()*.12);
 if(mode==="retreat"||attack>defense){
   let lost=mode==="retreat"?Math.round(total*.08):Math.min(total,Math.round(t.force*.21));
   distributeLoss(defenders,lost);
   const dest=(ADJ[t.to]||[]).find(c=>c!==t.from&&owner(c)==="東海帝国");
   defenders.forEach(u=>{let pool=u.type==="guard"?S.g:S.r;pool[t.to]=Math.max(0,(pool[t.to]||0)-u.str);if(dest){pool[dest]=(pool[dest]||0)+u.str;u.pref=dest}else{u.str=0}});
   S.conquered[t.to]="関東連邦";delete S.occupied?.[t.to];w.enemy[t.to]=(w.enemy[t.to]||0)+Math.round(t.force*.8);
   w.enemy[t.from]=Math.max(0,(w.enemy[t.from]||0)-t.force);
   if(S.campaigns?.[t.to])S.campaigns[t.to].active=false;
   log(`関東軍が${names[t.to]}を占領。守備軍は${dest?names[dest]+"へ撤退":"壊滅"}。損害${lost.toLocaleString()}。`);
 }else{
   let loss=Math.min(total,Math.round(t.force*(mode==="fortify"?.07:.11)));
   distributeLoss(defenders,loss);w.enemy[t.from]=Math.max(0,(w.enemy[t.from]||0)-Math.round(t.force*.34));
   log(`${names[t.to]}の防衛に成功。東海軍損害${loss.toLocaleString()}、関東軍は撤退。`);
 }
 w.threat=null;S.unitPos=Object.fromEntries(unitDefs.map(u=>[u.id,u.pref]));S.unitStr=Object.fromEntries(unitDefs.map(u=>[u.id,u.str]));
 renderAll();showWar();
}
function advanceWar(){
 const w=ensureWar();
 for(const p of [...w.friendlyProduction])if(p.due<=S.t){
   const specId=UNIT_SPECS[p.spec]?p.spec:"inf",spec=UNIT_SPECS[specId];
   if(owner(p.c)==="東海帝国"){
     addArmy(p.c,specId,p.amount,p.type||spec.type);
     log(`${names[p.c]}へ${spec.name}${(p.amount/10000).toFixed(0)}万人を配備。`);
   }else{
     S.m+=Math.round((p.amount/10000)*spec.cost/2);
     log(`${names[p.c]}の配備先喪失。生産費の半額を返還。`);
   }
   w.friendlyProduction.splice(w.friendlyProduction.indexOf(p),1);
 }
 if(w.status==="won")return;
 w.funds+=90;
 const owned=KANTO_CODES.filter(c=>owner(c)==="関東連邦");if(!owned.length)return;
 const recruits=owned.filter(c=>w.enemy[c]>=0).sort((a,b)=>(ADJ[b]||[]).filter(n=>owner(n)==="東海帝国").length-(ADJ[a]||[]).filter(n=>owner(n)==="東海帝国").length);
 if(w.funds>=80&&recruits.length){const c=recruits[0],n=10000;w.funds-=80;w.enemy[c]=(w.enemy[c]||0)+n;log(`関東軍が${names[c]}で増員。`)}
 if(S.t<3||w.threat||S.t-w.lastAttackWeek<2)return;
 const fronts=owned.flatMap(from=>(ADJ[from]||[]).filter(to=>owner(to)==="東海帝国").map(to=>({from,to}))).filter(p=>w.enemy[p.from]>=30000);
 if(!fronts.length)return;
 fronts.sort((a,b)=>((S.r[a.to]||0)+(S.g[a.to]||0))-((S.r[b.to]||0)+(S.g[b.to]||0)));
 const {from,to}=fronts[0],force=Math.min(Math.round(w.enemy[from]*.45),90000);
 w.threat={from,to,force,week:S.t};w.lastAttackWeek=S.t;
 log(`関東連邦が${names[to]}への侵攻準備。防衛方針を選択してください。`);
}
function warData(c){
 let d=WAR_DATA[+c];
 if(d)return d;

}
function ensureCampaign(c){
 S.campaigns=S.campaigns||{};
 if(!S.campaigns[c]){
   let d=warData(c);
   const army=KANTO_CODES.includes(+c)?ensureWar().enemy[c]:null;
   S.campaigns[c]={target:+c,active:false,stage:0,selected:[],enemy:army!=null?d.bases.map(()=>Math.round(army/d.bases.length)):[...d.enemy],losses:0,morale:100,enemyMorale:100,turns:0,source:null};
 }
 S.campaigns[c].target=+c;
 if(KANTO_CODES.includes(+c)&&+c!==14){const cp=S.campaigns[c],d=warData(c);while(cp.enemy.length<d.bases.length)cp.enemy.push(Math.max(1000,Math.round((ensureWar().enemy[c]||10000)/d.bases.length)))}
 return S.campaigns[c];
}

function fightGeneric(c,mode){
 c=+c;
 const cp=ensureCampaign(c),d=warData(c);
 if(!cp.active||cp.stage>=d.bases.length)return;
 if(!["assault","encircle"].includes(mode))return;
 if(cp.battleWeek!==S.t){cp.battleWeek=S.t;cp.battlesThisWeek=0}
 if(cp.battlesThisWeek>=3)return alert("今週の連続攻撃は終了です。次の週へ進んでください。");
 const force=cp.selected.map(id=>unitDefs.find(u=>u.id===id)).filter(u=>u&&u.str>0);
 const troops=force.reduce((n,u)=>n+u.str,0);
 const suppliedCities=citySupply();
 const total=force.reduce((n,u)=>n+u.str*UNIT_SPECS[u.spec||"inf"].atk*(cityOfUnit(u)&&!suppliedCities.has(cityOfUnit(u))?.5:1),0);
 if(!troops)return alert("出撃軍の兵力がありません。増援か撤退を選んでください。");
 cp.battlesThisWeek++;cp.turns++;
 let enemy=Math.max(1000,cp.enemy[cp.stage]||1000);
 if(cp.stage>0&&Math.random()<.35){
   const reinf=7000+Math.floor(Math.random()*12)*1000;
   enemy+=reinf;cp.enemy[cp.stage]=enemy;
   if(KANTO_CODES.includes(c))ensureWar().enemy[c]=(ensureWar().enemy[c]||0)+reinf;
   log(`${owner(c)}が${d.bases[cp.stage]}へ増援${reinf.toLocaleString()}を投入。`);
 }
 const assigned=PEOPLE.filter(p=>{
   const v=personState(p);
   return v.role==="army"&&cp.selected.includes(v.target)&&PERSON_DETAILS[p[0]]?.[3];
 });
 const hero=assigned.length?assigned[Math.floor(Math.random()*assigned.length)]:null;
 const activated=hero&&Math.random()<.30;
 const skill=activated?PERSON_DETAILS[hero[0]][3]:null;
 if(skill){
   log(`【スキル発動】${hero[1]}の『${PERSON_DETAILS[hero[0]][1]}』が炸裂！`);
   const damage=Math.min(enemy-1000,Math.round(enemy*(skill.enemyDamage||0)));
   if(damage>0){
     enemy-=damage;cp.enemy[cp.stage]=enemy;
     if(KANTO_CODES.includes(c))ensureWar().enemy[c]=Math.max(0,(ensureWar().enemy[c]||0)-damage);

 const target=d.bases[cp.stage],terrain=1+cp.stage*.045;
 const tactic=mode==="assault"?1.10:1.18;

 const defense=enemy*terrain*(.65+cp.enemyMorale*.0035)*(.93+Math.random()*.18);
 if(power>=defense){
   if(KANTO_CODES.includes(c))ensureWar().enemy[c]=Math.max(0,(ensureWar().enemy[c]||0)-enemy);
   const loss=Math.max(100,Math.round(enemy*(mode==="assault"?.09:.06)*(skill?.loss||1)/100)*100);
   distributeLoss(force,loss);shakeCityMap();cp.losses+=loss;cp.enemy[cp.stage]=0;
   cp.morale=Math.min(100,cp.morale+7);cp.enemyMorale=Math.max(25,cp.enemyMorale-15);cp.stage++;
   log(`${names[c]}・${target}攻略成功！ 損害約${loss.toLocaleString()}。${cp.stage<d.bases.length&&cp.battlesThisWeek<3?"勢いに乗り、次の拠点へ進撃可能。":""}`);
   if(cp.stage>=d.bases.length){
     completeConquest(c,force,cp.source);cp.active=false;
     alert(`${names[c]}全拠点制圧！\n即時に東海帝国領へ編入。隣の県へ進軍できます。`);
   }
 }else{
   const loss=Math.max(100,Math.round(enemy*(mode==="assault"?.145:.10)*(skill?.loss||1)/100)*100);
   distributeLoss(force,loss);shakeCityMap();cp.losses+=loss;
   cp.morale=Math.max(20,cp.morale-13);cp.enemyMorale=Math.min(100,cp.enemyMorale+5);
   const enemyLoss=Math.min(enemy-1000,Math.round(troops*.06));
   cp.enemy[cp.stage]=enemy-enemyLoss;
   if(KANTO_CODES.includes(c))ensureWar().enemy[c]=Math.max(0,(ensureWar().enemy[c]||0)-enemyLoss);

function distributeLoss(force,loss){

showManual=function(){S.personView=false;S.worldView=false;S.hqView=false;S.forceView=false;S.manualView=true;side.innerHTML=`<div class="panel"><button onclick="showHQ()">指令部へ戻る</button><h2>都市戦線の遊び方</h2><p class="frontInfo">1ターン＝1週間。タイトルの「小田原攻略から始める」で田原・大島を配備した状態から遊べます。</p></div><div class="panel"><b>① 偵察と出撃</b><p class="frontInfo">敵都市をタップし「偵察する」を選ぶと、情報8で兵力と敵の構えを確認。当週の奇襲が解禁されます。隣接する味方都市から出撃し、参加軍団を選びます。</p><b>② 戦術と行動</b><p class="frontInfo">軍団は週に2行動。強襲は1、包囲・奇襲・防御は2を使用します。包囲には兵がいる味方の隣接都市2か所が必要です。奇襲は攻勢準備中の敵に有効、陣地防御中の敵には不利です。牽制・防御は低損害で敵を削り、都市の制圧は行いません。</p><b>③ 武将の指揮</b><p class="frontInfo">出撃軍団へ任命した人物の固有指揮を使用できます。最大3人が交戦の各段階で発動。大島は突破、田原は損害抑制などの効果を持ち、使用から2週間で再使用できます。人事画面で軍団への任命も変更可能です。</p><b>④ 制圧と補給</b><p class="frontInfo">制圧した都市に出撃部隊が前進します。敵の残存兵は接続する敵都市へ撤退。県内の全都市を制圧すると県全体が東海領になります。地図の◆が補給拠点です。可児・名古屋・浜松・松本・金沢・津など、味方が支配する補給拠点から味方都市だけを伝って届く都市は補給あり。可児から切り離されても、別の補給拠点があれば補給できます。敵の補給拠点も制圧した瞬間から利用可能です。補給が切れると火力半減、毎週3%の兵力を失います。</p><b>⑤ 行軍・防衛</b><p class="frontInfo">味方都市で軍団を選択し「味方都市へ再配置」の移動先を選びます。隣接する味方都市へは即時、街道2区間以上の遠方へは次週到着します。移動は戦闘の行動回数を使わず、攻撃の残り行動も回復しません。遠方から到着した部隊は再編成が必要なため、その週は攻撃できません。敵都市を飛び越える移動はできません。全軍画面からの県間再配置・分遣も同じ距離基準です。敵の反撃予告は赤い進軍路で表示。迎撃・堅守・偵察後の遊撃・計画撤退を選べます。隣接する味方都市の軍団を援軍として送ると、その場で守備都市に到着します。資金80で防御準備も可能です。防衛戦には武将の固有指揮が反映され、結果を戦闘画面で確認できます。</p><b>⑥ 次の戦略</b><p class="frontInfo">小田原・厚木・横浜を確保したら、品川や新宿へ進撃できます。指令部で内政・人事・技術投資・生産を行い、全関東の制圧を目指します。研究と生産は資金や食料を消費します。</p><b>操作・保存</b><p class="frontInfo">都市をタップして選択。地図はドラッグ／スワイプで移動し、＋−またはホイールで拡大縮小。「東京拡大」で東京圏を詳しく表示。「東海」「関東」「全国」で表示位置を戻せます。数字の印は複数拠点のまとまりです。タップして都市を選ぶか「この周辺を拡大」で分離できます。戦闘演出は「結果へ」でスキップ。保存は上部の「保存」、再開は同じファイル・同じブラウザの「作戦再開」です。</p></div>`;if(innerWidth<761)side.scrollIntoView({behavior:'smooth',block:'start'})};

 const oursStart=units.reduce((n,u)=>n+u.str,0),enemyStart=Math.max(0,Math.min(t.force,S.front.enemy[from]||0));if(!enemyStart)return;

 const commanders=PEOPLE.filter(p=>{const v=personState(p);return v.role==='army'&&units.some(u=>u.id===v.target)&&(S.front.cooldowns[p[0]]||0)<=S.t}).slice(0,2);
 let ours=oursStart,enemy=enemyStart,allyMorale=100,morale=100;const phases=[],merits=[];

 }else for(let round=0;round<3&&ours>0&&enemy>0;round++){

  if(morale<=25||allyMorale<=25)break;
 }
 let defensePower=oursStart*spec*terrain.def*armyBonus(units)*plan.power*(fort?1.4:1)*(supplied?1:.65);

function v168NativeFaction(pref){
  return Object.keys(factions).find(f=>factions[f].codes.includes(+pref))||'不明';
}
function v168IsEnemyFaction(f){
  return f && f!=='東海帝国' && f!=='不明';
}
function v168RegionForPref(pref){
  pref=+pref;
  if(pref===1)return 'hokkaido';
  if(pref>=2&&pref<=7)return 'tohoku';
  if(pref>=8&&pref<=14)return 'kanto';
  if(pref>=16&&pref<=25)return 'tokai';
  if(pref>=26&&pref<=30)return 'kansai';
  if(pref>=31&&pref<=39)return 'chugoku_shikoku';
  if(pref>=40&&pref<=46)return 'kyushu_okinawa';
  if(pref===47)return CITY_REGIONS.okinawa?'okinawa':'japan';
  return 'japan';
}
function v168ProvinceArmy(f){
  if(f==='北海道帝国')return 800000;
  if(f==='関西連合'||f==='死国'||f==='女帝国')return 120000;
  if(f==='九州王国')return 80000;
  if(f==='関東連邦')return 70000;
  if(f==='東北共和国')return 60000;
  if(f==='中国')return 40000;
  if(f==='沖縄諸国')return 10000;
  return 40000;
}
// 全国の未初期化守備隊を一度だけ配置する。既存の損害・制圧状況は上書きしない。
initNationalFrontCities=function(){
  initFront();
  S.front.control=S.front.control||{};S.front.enemy=S.front.enemy||{};
  S.front.nationalSeededCities=S.front.nationalSeededCities||{};
  for(const [id,c] of Object.entries(CITY_DATA)){
    if(!S.front.control[id])S.front.control[id]=c.initialFaction||v168NativeFaction(c.pref);
  }
  for(const [id,c] of Object.entries(CITY_DATA)){
    const faction=cityOwner(id);
    if(faction==='東海帝国'){S.front.enemy[id]=0;S.front.nationalSeededCities[id]=true;continue}
    if(!v168IsEnemyFaction(faction))continue;
    if(S.front.nationalSeededCities[id])continue;
    const samePref=Object.keys(CITY_DATA).filter(k=>CITY_DATA[k].pref===c.pref&&cityOwner(k)!=='東海帝国'&&!CITY_DATA[k].expansion202);
    let n=c.expansion202?0:Math.max(1000,Math.floor(v168ProvinceArmy(faction)/Math.max(1,samePref.length)));
    if(typeof MEGA_CITIES!=='undefined'&&MEGA_CITIES[id])n=Math.round(n*1.35);
    else if(SUPPLY_HUBS[id])n=Math.round(n*1.15);
    if(!(S.front.enemy[id]>0))S.front.enemy[id]=n;
    S.front.nationalSeededCities[id]=true;
  }
  frontSync();
  return S.front;
};

// 1) 補給網：供給元と親ルートをBFSで保持する。
citySupplyInfo=function(){
  if(V178_READY&&S.sim?.enabled)return v178Supply('東海帝国');
  const supplied=new Set(),source=new Map(),parent=new Map(),depth=new Map(),queue=[];
  for(const id of Object.keys(SUPPLY_HUBS)){
    if(cityOwner(id)==='東海帝国'){
      supplied.add(id);source.set(id,id);parent.set(id,null);depth.set(id,0);queue.push(id);
    }
  }
  for(let head=0;head<queue.length;head++){
    const here=queue[head];
    for(const next of CITY_DATA[here]?.neighbors||[]){
      if(cityOwner(next)!=='東海帝国'||supplied.has(next))continue;
      supplied.add(next);source.set(next,source.get(here));parent.set(next,here);depth.set(next,(depth.get(here)||0)+1);queue.push(next);
    }
  }
  return {supplied,source,parent,depth};
};
function v169SupplyPath(id){
  const info=citySupplyInfo();if(!info.supplied.has(id))return [];
  const out=[id];let cur=id,guard=0;
  while(info.parent.get(cur)&&guard++<80){cur=info.parent.get(cur);out.push(cur)}
  return out.reverse();
}

// 2) 都市記号：補給状態と偵察済み脅威をマップ上へ重ねる。
function v169ThreatData(id){
  const intel=S.front?.intel?.[id],baseLevel=Math.max(0,Math.min(3,Number(intel?.level||(intel?.week!=null?1:0))));
  const age=intel?.week==null?99:Math.max(0,S.t-intel.week),level=baseLevel;
  const enemy=Math.max(0,Number(intel?.strength??S.front?.enemy?.[id]??0));
  const c=CITY_DATA[id];
  let friendly=0;
  for(const n of c?.neighbors||[])if(cityOwner(n)==='東海帝国'){
    const supplied=citySupply().has(n),power=frontArmy(n).reduce((sum,u)=>sum+u.str,0);
    friendly+=power*(supplied?1:.5);
  }
  const terrain=frontTerrain(id)?.def||1,ratio=enemy*terrain/Math.max(1,friendly);
  let key='critical',label='危険';
  if(ratio<.65){key='low';label='低'}else if(ratio<1.0){key='watch';label='警戒'}else if(ratio<1.45){key='high';label='高'}
  const meter=Math.max(8,Math.min(100,ratio/1.8*100));
  return {intel,level,age,enemy,friendly,ratio,key,label,meter};
}
function v169EnemyStrengthText(id,data){
  if(!data.level)return '未確認';
  const n=data.enemy,age=data.age,extra=Math.min(.35,age*.08);
  if(data.level===1){const q=.38+extra;return `${Math.max(0,Math.round(n*(1-q)/1000))}千〜${Math.round(n*(1+q)/1000)}千人`;}
  if(data.level===2){const q=.16+extra;return `${Math.max(0,Math.round(n*(1-q)/1000))}千〜${Math.round(n*(1+q)/1000)}千人`;}
  if(age===0)return `${n.toLocaleString()}人`;
  const q=.06+extra;return `${Math.max(0,Math.round(n*(1-q)/1000))}千〜${Math.round(n*(1+q)/1000)}千人`;
}
function v169IntelSummary(id){
  const d=v169ThreatData(id),intel=d.intel;
  if(!d.level)return `<div class="intelSummary level0"><div class="intelHead"><b>敵情インテル</b><span class="intelLevel">情報Lv 0/3</span></div><p class="frontInfo">敵兵力・構え・脅威度は不明。偵察を行うと段階的に情報が精密になります。</p></div>`;
  const stance=d.level>=2?(intel?.stance||'不明'):'Lv2で判明';
  const threat=d.level>=2?`<span class="threatLabel threat-${d.key}">${d.label}</span>`:'Lv2で判定';
  const ratio=d.level>=3?`${d.ratio.toFixed(2)}倍`:'Lv3で表示';
  const stale=d.age?` · ${d.age}週前`:' · 今週更新';
  return `<div class="intelSummary level${d.level}"><div class="intelHead"><b>敵情インテル${stale}</b><span class="intelLevel">情報Lv ${d.level}/3</span></div><div class="intelGrid"><div>推定総兵力<b>${v169EnemyStrengthText(id,d)}</b></div><div>脅威度<b>${threat}</b></div><div>敵の構え<b>${stance}</b></div><div>対味方戦力比<b>${ratio}</b></div></div>${d.level>=2?`<div class="threatMeter" title="敵戦力・地形を隣接味方戦力と比較"><i style="width:${d.meter}%"></i></div>`:''}<small>${d.level===1?'概略兵力のみ。次回偵察で構えと脅威度を分析。':d.level===2?'兵力レンジ・構え・脅威度を分析。次回偵察で精密値へ。':'精密インテル。時間経過で推定幅が広がります。'}</small></div>`;
}

frontScout=function(id){
  initNationalFrontCities();const prev=S.front.intel[id]||{};
  if(prev.week===S.t)return alert('この都市は今週すでに偵察済みです。');
  if(S.ip<8)return alert('情報ポイントが8必要です。');
  S.ip-=8;const level=Math.min(3,Math.max(0,Number(prev.level||(prev.week!=null?1:0)))+1);
  S.front.intel[id]={week:S.t,stance:frontStance(id),level,strength:Math.max(0,S.front.enemy[id]||0)};
  const d=v169ThreatData(id);log(`${CITY_DATA[id].name}を偵察。情報Lv${level}、${level>=2?'脅威度'+d.label+'、':''}${level>=3?'敵'+d.enemy.toLocaleString()+'人を精密確認':'敵情を更新'}。`);renderTop();selectCity(id);
};

function v170TheaterStats(key){
  const ids=Object.keys(CITY_DATA).filter(id=>v170RegionForPref(CITY_DATA[id].pref)===key),own=ids.filter(id=>cityOwner(id)==='東海帝国');
  const border=ids.filter(id=>cityOwner(id)!=='東海帝国'&&CITY_DATA[id].neighbors.some(n=>cityOwner(n)==='東海帝国'));
  const cut=v170CutCities().filter(id=>ids.includes(id));
  const friendly=unitDefs.filter(u=>u.str>0).filter(u=>{const c=cityOfUnit(u);return c&&ids.includes(c)}).reduce((n,u)=>n+u.str,0);
  const intelEnemy=border.filter(id=>(S.front.intel[id]?.level||0)>0).reduce((n,id)=>n+(S.front.intel[id]?.strength??S.front.enemy[id]??0),0);
  return {ids,own,border,cut,friendly,intelEnemy};
}

function v170TurnCheck(){
  initNationalFrontCities();const ready=v170ReadyForces(),cut=v170CutCities(),threat=S.front?.threat,frontier=v170FrontierCities();const lines=[];
  if(threat)lines.push(`⚠ 敵侵攻予告：${CITY_DATA[threat.from].name} → ${CITY_DATA[threat.to].name}（第${threat.due}週）`);

 let funds=0,industry=0,food=0,cities=0;
 for(const [id,e] of Object.entries(CITY_ECONOMY))if(CITY_DATA[id]&&cityOwner(id)===faction){funds+=e.weeklyFunds||0;industry+=e.weeklyIndustry||0;food+=e.weeklyFood||0;cities++}

v173ResolveNpcBattle=function(from,to){

 if(!cfg||!CITY_DATA[from]?.neighbors.includes(to)||v173AreAllied(attacker,defender)||defender==='東海帝国')return null;
 const atkTotal=v173Army(from),defTotal=v173Army(to);if(atkTotal<12000)return null;

 if(win){

// 1) 関東以外のNPCも東海帝国へ自律侵攻
// 2) 都市経済・工業・食料からNPCの週次補充を算出
// 3) 首都からの補給線と都市補給容量を戦闘力へ反映
// 4) 東海帝国側の兵科生産にも工業力・工業備蓄を反映

const V175_CAPITALS={
 '女帝国':'niigata','東北共和国':'sendai','関東連邦':'otemachi','関西連合':'osaka',
 '中国':'hiroshima','死国':'takamatsu','九州王国':'fukuoka','北海道帝国':'sapporo','沖縄諸国':'naha'
};

function v175EnsureState(){
 initNationalFrontCities();
 S.front.v175=S.front.v175||{lastProductionWeek:0,lastGain:{},supplyPct:{},productionReports:[],ending:null,endingShown:false};
 const x=S.front.v175;x.lastGain=x.lastGain||{};x.supplyPct=x.supplyPct||{};x.productionReports=x.productionReports||[];
 return x;
}
function v175OwnedCities(faction){return Object.keys(CITY_DATA).filter(id=>cityOwner(id)===faction)}
function v175BestCapital(faction,owned){
 const fixed=V175_CAPITALS[faction];if(fixed&&owned.includes(fixed))return fixed;
 return owned.slice().sort((a,b)=>{const x=v173Economy(a),y=v173Economy(b);return ((y.strategic||50)+(y.logistics||50)+(y.economy||50))-((x.strategic||50)+(x.logistics||50)+(x.economy||50))})[0]||null;
}
function v175NpcSupplyInfo(faction){
 const owned=v175OwnedCities(faction),capital=v175BestCapital(faction,owned),supplied=new Set();
 if(!capital)return{capital:null,supplied,owned};
 const q=[capital];supplied.add(capital);
 for(let i=0;i<q.length;i++)for(const n of CITY_DATA[q[i]].neighbors||[])if(cityOwner(n)===faction&&!supplied.has(n)){supplied.add(n);q.push(n)}
 return{capital,supplied,owned};
}
function v175IsSupplied(id,faction){
 if(faction==='東海帝国')return cityOwner(id)==='東海帝国'&&citySupply().has(id);
 return v175NpcSupplyInfo(faction).supplied.has(id);
}
function v175SupplyCombatFactor(id,faction,attack){
 const supplied=v175IsSupplied(id,faction),army=Math.max(1,v173Army(id)),cap=Math.max(50000,v173Economy(id).supplyCapacity||90000);
 const overload=Math.max(.78,Math.min(1,cap/army));
 return (supplied?1:(attack?.62:.72))*overload;
}
function v175NpcFrontCities(faction,supply){
 const supplied=supply?.supplied||new Set();
 return v175OwnedCities(faction).filter(id=>supplied.has(id)&&CITY_DATA[id].neighbors.some(n=>v178AtWar(faction,cityOwner(n))));
}
function v175RunNpcEconomy(){
 const st=v175EnsureState();if(st.lastProductionWeek===S.t)return;st.lastProductionWeek=S.t;
 st.lastGain={};st.supplyPct={};
 for(const faction of V174_AI_ORDER){
  const owned=v175OwnedCities(faction);if(!owned.length){st.lastGain[faction]=0;st.supplyPct[faction]=0;continue}
  const supply=v175NpcSupplyInfo(faction),out=v171CityOutput(faction);
  const cityPower=owned.reduce((n,id)=>{const e=v173Economy(id);return n+(e.production||40)*5+(e.military||40)*4},0);
  const supplyShare=supply.supplied.size/Math.max(1,owned.length);
  let gain=Math.round((out.industry*520+out.food*170+cityPower)*(0.55+0.45*supplyShare));
  gain=Math.max(1200,Math.min(52000,gain));
  const fronts=v175NpcFrontCities(faction,supply).sort((a,b)=>{
   const ea=v173Economy(a),eb=v173Economy(b);return ((eb.strategic||50)+(eb.military||50))-((ea.strategic||50)+(ea.military||50));
  });
  const targets=(fronts.length?fronts.slice(0,4):[supply.capital]).filter(Boolean);
  if(!targets.length)continue;
  let remain=gain;
  targets.forEach((id,i)=>{
   const add=i===targets.length-1?remain:Math.round(gain/targets.length);remain-=add;
   const cap=Math.max(90000,Math.round((v173Economy(id).supplyCapacity||90000)*1.25));
   v173SetArmy(id,faction,v173Army(id)+Math.min(add,Math.max(0,cap-v173Army(id))));
  });
  st.lastGain[faction]=gain;st.supplyPct[faction]=Math.round(supplyShare*100);
  st.productionReports.unshift({week:S.t,faction,gain,cities:owned.length,supplied:supply.supplied.size,capital:supply.capital});
 }
 st.productionReports=st.productionReports.slice(0,45);
 const total=Object.values(st.lastGain).reduce((a,b)=>a+(+b||0),0);
 log(`【全国軍需】列強9勢力が都市経済から計${Math.round(total/1000)}千人を補充。補給線が切れた地域は生産効率が低下。`);
}

// 関東連邦は既存の「侵攻予告→防衛方針」システムを残す。
// それ以外のNPCは東海帝国も通常の攻撃候補として評価する。
v173BorderOptions=function(faction){
 const cfg=V173_AI_CONFIG[faction];if(!cfg)return [];
 const options=[];
 for(const [from,c] of Object.entries(CITY_DATA)){
  if(cityOwner(from)!==faction)continue;const atk=v173Army(from);if(atk<12000)continue;
  for(const to of c.neighbors){
   const defender=cityOwner(to);if(!v178AtWar(faction,defender))continue;
   if(defender==='東海帝国'&&faction==='関東連邦')continue;
   const def=Math.max(4000,v173Army(to)),econ=v173Economy(to),terrain=frontTerrain(to)?.def||1;
   const atkSupply=v175SupplyCombatFactor(from,faction,true),defSupply=v175SupplyCombatFactor(to,defender,false);
   const ratio=(atk*cfg.commit*cfg.aggression*atkSupply)/(def*terrain*defSupply),sea=v173IsSea(from,to);
   const routeBonus=(typeof v172RouteName==='function'&&v172RouteName(from,to))?8:0;
   const tokaiBonus=defender==='東海帝国'?7:0,targetValue=(econ.strategic||50)*.22+(econ.military||50)*.08+(econ.logistics||50)*.06;
   const jitter=v173Rand(`${S.t}|score175|${faction}|${from}|${to}`)*13;
   const score=ratio*58+targetValue+routeBonus+tokaiBonus+jitter-(sea?4:0);
   options.push({from,to,defender,score,ratio,atk,def,sea});
  }
 }
 return options.sort((a,b)=>b.score-a.score);
};

function v175PlayerRetreat(to,attacker){
 const units=frontArmy(to).filter(u=>u.str>0);
 const candidates=(CITY_DATA[to]?.neighbors||[]).filter(n=>cityOwner(n)==='東海帝国');
 candidates.sort((a,b)=>{const ea=v173Economy(a),eb=v173Economy(b);return ((v175IsSupplied(b,'東海帝国')?1000:0)+(eb.supplyCapacity||0)+v173Army(b))-((v175IsSupplied(a,'東海帝国')?1000:0)+(ea.supplyCapacity||0)+v173Army(a))});
 const retreat=candidates[0]||null;
 for(const u of units){if(u.str<=0)continue;if(retreat)frontMoveUnit(u,retreat);else u.str=0}

v173ResolveNpcBattle=function(from,to){
 const attacker=cityOwner(from),defender=cityOwner(to),cfg=V173_AI_CONFIG[attacker];
 if(!cfg||!CITY_DATA[from]?.neighbors.includes(to)||!v178AtWar(attacker,defender))return null;
 if(defender==='東海帝国'&&attacker==='関東連邦')return null;
 const atkTotal=v173Army(from),defTotal=v173Army(to);if(atkTotal<12000)return null;
 const seed=`${S.t}|175|${attacker}|${from}|${to}`,commit=Math.max(9000,Math.floor(atkTotal*cfg.commit));
 const atkRoll=.90+v173Rand(seed+'a')*.28,defRoll=.88+v173Rand(seed+'d')*.26;
 const sea=v173IsSea(from,to),terrain=frontTerrain(to)?.def||1,routeFactor=v174SeaAttackFactor(from,to);
 const atkSupply=v175SupplyCombatFactor(from,attacker,true),defSupply=v175SupplyCombatFactor(to,defender,false);
 const attackPower=commit*cfg.aggression*atkRoll*routeFactor*atkSupply,defensePower=Math.max(4000,defTotal)*terrain*defRoll*defSupply;
 const win=attackPower>defensePower*.94;
 const atkLossRate=win?.16+v173Rand(seed+'al')*.12:.26+v173Rand(seed+'al')*.17;
 const defLossRate=win?.48+v173Rand(seed+'dl')*.24:.17+v173Rand(seed+'dl')*.17;
 const attackerLoss=Math.min(commit,Math.max(1200,Math.round(commit*atkLossRate))),defenderLoss=Math.min(defTotal,Math.max(1000,Math.round(defTotal*defLossRate)));
 const attackSurvivors=Math.max(1000,commit-attackerLoss),defSurvivors=Math.max(0,defTotal-defenderLoss);
 let retreat=null;
 if(defender==='東海帝国'){
  const defenders=frontArmy(to);frontDamage(defenders,defenderLoss);
  if(win){
   retreat=v175PlayerRetreat(to,attacker);
   v173SetArmy(from,attacker,Math.max(1000,atkTotal-commit));
   S.front.control[to]=attacker;v173SetArmy(to,attacker,attackSurvivors);
  }else{
   v173SetArmy(from,attacker,Math.max(1000,atkTotal-attackerLoss));
  }
 }else{
  if(win){
   v173SetArmy(from,attacker,Math.max(1000,atkTotal-commit));
   retreat=v173RetreatCity(from,to,defender);if(retreat&&defSurvivors>0)v173SetArmy(retreat,defender,v173Army(retreat)+Math.round(defSurvivors*.72));
   S.front.control[to]=attacker;v173SetArmy(to,attacker,attackSurvivors);
  }else{
   v173SetArmy(from,attacker,Math.max(1000,atkTotal-attackerLoss));
   v173SetArmy(to,defender,defSurvivors);
  }
 }
 frontSync();
 const r={week:S.t,from,to,attacker,defender,win,sea,attackerLoss,defenderLoss,retreat,route:v173RouteLabel(from,to),atkSupply,defSupply};
 v178RecordBattle(r);v173PushReport(r);
 log(`【全国列強戦況】${v173ReportText(r)}${!atkSupply||atkSupply<.8?' 攻撃側は補給不良。':''}${retreat&&win?` ${defender}軍は${CITY_DATA[retreat]?.name||'後方'}へ後退。`:''}`);
 if(defender==='東海帝国'){
  const msg=win?`【敵軍侵入】${attacker}が${CITY_DATA[to].name}を占領。`:`【国土防衛】${CITY_DATA[to].name}守備隊が${attacker}軍を撃退。`;
  log(msg);
 }
 return r;
};

  let remaining=Math.max(900,Math.min(48000,Math.round((out.industry*430+out.food*145+power)*(.52+share*.48)))),actual=0;
  const fronts=v178Fronts(faction),targets=owned.filter(id=>sup.supplied.has(id)).sort((a,b)=>(fronts.includes(b)?100000:0)-(fronts.includes(a)?100000:0)+(v173Economy(b).military||50)-(v173Economy(a).military||50));
  const primary=targets.slice(0,Math.max(4,fronts.length));
  for(let i=0;i<primary.length&&remaining>0;i++){
   const id=primary[i],cap=Math.max(80000,Math.round((v173Economy(id).supplyCapacity||90000)*1.35)),room=Math.max(0,cap-v173Army(id)),add=Math.min(room,Math.ceil(remaining/(primary.length-i)));

 }
 if(cityOwner(a.target)==='東海帝国'){a.mode='stop';v179Note(`${CITY_DATA[a.target].name}を確保。作戦達成、次の命令を待機。`);return}

function v192Gather(g,to,desired){
 const p=v188PlayerFaction(),st=v178EnsureStrategy(),paths=v178Paths(to,p),sup=v178Supply(p),fronts=new Set(v178Fronts(p));
 let need=Math.max(0,desired-v173Army(to)-st.moves.filter(m=>m.faction===p&&m.to===to).reduce((n,m)=>n+m.amount,0)),count=0;
 const donors=g.cities.filter(id=>id!==to&&paths.has(id)&&sup.supplied.has(id)).sort((a,b)=>paths.get(a).length-paths.get(b).length);
 for(const id of donors){if(need<4000||count>=2)break;const reserve=fronts.has(id)?Math.max(18000,v178DesiredArmy(id,p)):id===sup.capital?16000:SUPPLY_HUBS[id]?8000:5000,available=Math.max(0,v173Army(id)-reserve),amount=Math.floor(Math.min(need,available,v173Army(id)*.6));
  if(amount<4000)continue;const m=v178OrderReinforcement(id,to,p,amount,paths.get(id).slice().reverse(),g.name+'・'+V192_MODES[g.mode]);if(m){m.theatre=g.id;count++;need-=m.amount}
 }return count;
}
function v192RunOrders(){
 if(!v188CampaignEnabled()||S.v188.ending)return [];const x=v192State(),p=x.player;v188ResetActions();if(x.lastRun===S.t)return x.notes;
 x.lastRun=S.t;x.notes=[];const engaged=new Set(),groups=[...x.groups];if(groups.length){const offset=(S.t-1)%groups.length;groups.push(...groups.splice(0,offset))}
 for(const g of groups){if(['stop','manual'].includes(g.mode))continue;let message='',moves=0;g.lastWeek=S.t;
  if(!g.cities.length)message='担当都市がありません。都市を割り当ててください。';
  else if(['defend','refill'].includes(g.mode)){
   if(!g.cities.includes(g.target)&&cityOwner(g.target)===p)message='目標都市をこの方面軍の担当に割り当ててください。';
   else if(cityOwner(g.target)!==p)message='目標が自国都市ではないため待機。目標を変更してください。';
   else {const desired=g.mode==='defend'?Math.max(30000,v178DesiredArmy(g.target,p)):Math.min(60000,v173Economy(g.target).supplyCapacity||60000);moves=v192Gather(g,g.target,desired);message=moves?`${CITY_DATA[g.target].name}へ増援${moves}隊を派遣。`:`${CITY_DATA[g.target].name}で待機。必要兵力を確保済み、行軍中、または派遣可能な余剰兵力なし。`}
  }else if(cityOwner(g.target)===p){g.mode='defend';message='目標を確保済み。防衛命令へ切り替えました。'}
  else if(v173AreAllied(p,cityOwner(g.target))||!v178AtWar(p,cityOwner(g.target)))message='目標国と交戦していないため待機。自動宣戦は行いません。';
  else {
   const d=v192Distances(g.target),candidates=[];
   for(const from of g.cities)if(!engaged.has(from)&&d.has(from))for(const to of CITY_DATA[from].neighbors)if(!engaged.has(to)&&v178CanAttackCity(from,to)&&d.has(to)&&d.get(to)<d.get(from))candidates.push({from,to,distance:d.get(to),pred:v191Predict(from,to,.6,'assault')});
   candidates.sort((a,b)=>a.distance-b.distance||b.pred.ratio-a.pred.ratio);const c=candidates[0];
   if(!c)message='担当都市から目標へ進める交戦経路がありません。前線都市を割り当ててください。';
   else {const desired=Math.max(35000,v178DesiredArmy(c.from,p));moves=v192Gather(g,c.from,desired);
    if(v188State().attacksUsed>=2)message='今週の攻撃枠を使用済み。増援を集めて待機。';
    else if(c.pred.army<11000||c.pred.reserve<8000||c.pred.ratio<1.15||!v177IsSupplied(c.from,p))message=`${CITY_DATA[c.from].name}で戦力・補給の確保待ち（戦力比 ${c.pred.ratio.toFixed(2)}）。`;
    else {const check=v191TacticEligibility(c.from,c.to,'assault');const r=check.ok?v177ResolveSimBattle(c.from,c.to,{commit:.6,tactic:'assault'}):null;
     if(r){v188State().attacksUsed++;r.playerAction=true;r.theatre=g.name;r.prediction=c.pred;r.tactic='assault';engaged.add(c.from);engaged.add(c.to);v191State().lastBattle=r;if(r.win&&!g.cities.includes(c.to))g.cities.push(c.to);v191EvaluateMissions();message=`${CITY_DATA[c.from].name} → ${CITY_DATA[c.to].name}：${r.win?'攻略成功':'攻撃失敗'}。`;if(r.win&&c.to===g.target){g.mode='defend';message+='目標達成、防衛へ移行。'}}else message='攻撃条件が変わったため待機。';
    }if(moves)message+=` 増援${moves}隊を派遣。`;
   }
  }
  g.status=message;x.notes.push({id:g.id,name:g.name,week:S.t,message});log(`【方面軍】${g.name}：${message}`);
 }return x.notes;
}

function v188AdvanceWeek(){

 V196_TURN_BUSY=true;let snapshot=null,roster=null;

  const player=v188PlayerFaction(),x=v191State(),departures=v191WeekSnapshot(),before=x.weekBaseline||departures;before.moves=departures.moves;

  v188RepositionAIOnly();const battles=v188RunAIWars(),ordered=(S.sim.lastBattles||[]).filter(r=>r.playerAction&&r.week===departures.week);S.sim.lastWeekBattles=battles.length;frontSync();v187ScanStrategicChanges(false);v191EvaluateMissions();v191RecordWeek(before,[...ordered,...battles]);x.reports[0].theatreNotes=JSON.parse(JSON.stringify(v192State().notes));x.weekBaseline=v191WeekSnapshot();v188CheckEnd();
  x.reportIndex=0;renderTop();paintMap();queueCitySymbols();
  if(!S.v188.ending){
   if(V211Comfort.returnMap()){V211Comfort.resumeMap(returnContext);V211Comfort.weekSummary(x.reports[0])}
   else{x.view='report';S.citySelected=null;v191Present(v191WeekReportHTML())}
  }

 }catch(e){

 }finally{V196_TURN_BUSY=false}
}

// 1. 既存の都市UIをハックして、ドラッグ可能なラッパー(div)を被せる

// 2. 指の動き（タッチ・マウス）を検知してドラッグ＆ドロップを実行する
let mobileDragState = null;

// 指が画面に触れたとき
document.addEventListener('pointerdown', (e) => {
    const unitEl = e.target.closest('.draggable-unit');
    if (!unitEl || e.button !== 0) return; 
    dragStartPos = { x: e.clientX, y: e.clientY, el: unitEl };
}, {passive: true});

// 指を動かしているとき
document.addEventListener('pointermove', (e) => {
    if (!dragStartPos) return;

    if (!mobileDragState) {
        const dx = Math.abs(e.clientX - dragStartPos.x);
        const dy = Math.abs(e.clientY - dragStartPos.y);
        
        // 縦方向の動きが大きい場合は「画面のスクロール」とみなす
        if (dy > dx && dy > 10) {
            dragStartPos = null; 
            return;
        } else if (dx > 10) {
            // 横方向に引っ張った場合、ドラッグ開始
            const unitId = dragStartPos.el.dataset.unitId;
            if(!unitId) return;

            // 追従するクローン要素を作成
            const clone = dragStartPos.el.cloneNode(true);

        // クローンを指の位置に合わせる
        mobileDragState.clone.style.left = e.clientX + 'px';
        mobileDragState.clone.style.top = e.clientY + 'px';
        
        // マップ上の重なっている都市を光らせる
        document.querySelectorAll('.cityNode.drag-over').forEach(el => el.classList.remove('drag-over'));

    }

// 指を離したとき（ドロップ）

    dragStartPos = null;

    // 描画リセット

        const targetCityId = cityIds[0];
        
        // 出発地と違う都市なら、移動・攻撃コマンドを実行！
        if (targetCityId && targetCityId !== mobileDragState.fromCity) {
            S.citySelected = mobileDragState.fromCity;

        }
    }
    mobileDragState = null;
});

// 画面外に出たときの安全処理

    }
});

if(S.citySelected) renderSide();

<script>
// === Ver.2.12 方面軍・部隊別 行動力システム ===
const V194_AP_MAX=2;
function v194State(){
  const p=v188PlayerFaction();
  if(!S.v194||S.v194.player!==p)S.v194={version:194,player:p,week:S.t,used:{central:0},notes:[]};
  const x=S.v194;x.used=x.used||{};x.notes=Array.isArray(x.notes)?x.notes:[];

function v194GroupForCity(city){

  if(cost>remain)return false;x.used[key]=v194UsedByKey(key)+cost;x.notes.unshift({week:S.t,key,cost,reason,city});x.notes=x.notes.slice(0,30);return true;
}
function v194Pools(){

  const unassigned=v178Owned(p).filter(id=>!assigned.has(id));if(unassigned.length||!groups.length)pools.unshift({key:'central',label:'中央予備軍',cities:unassigned.length,used:v194UsedByKey('central')});
  return pools.map(o=>({...o,remaining:Math.max(0,V194_AP_MAX-o.used)}));
}

}
function v194Reorganize(city){
  if(!v188CampaignEnabled()||S.v188.ending||cityOwner(city)!==v188PlayerFaction())return false;
  if(v194Remaining(city)<1){alert(`${v194PoolLabel(city)}の今週の行動力は残っていません。`);return false}

}

// 旧「国家全体で週2回」の値は互換用に0へ固定し、実判定はVer.2.07行動力へ移す。

// 戦術ごとの行動力判定。方面軍に所属しない都市は中央予備軍の2APを共有。
v191TacticEligibility=function(from,to,mode){
  const t=V191_TACTICS[mode];if(!t)return {ok:false,reason:'戦術を選択してください'};
  const remain=v194Remaining(from);if(t.orders>remain)return {ok:false,reason:`${v194PoolLabel(from)}の行動力が不足（残り${remain}／必要${t.orders}）`};

  return {ok:true,reason:t.note};
};

// 通常再配置＝AP1、強行軍＝AP2。強行軍は陸路の週移動量を2区間→4区間へ上げ、到着時に組織力を消耗。
function v194TravelWeeks(path,forced=false){
  if(!forced)return v191TravelWeeks(path);let index=0,weeks=0;while(index<(path?.length||0)-1){weeks++;let steps=0;while(index<path.length-1&&steps<4){const sea=v173IsSea(path[index],path[index+1]);if(sea&&steps)break;index++;steps+=sea?2:1}}return weeks;
}
function v194IssueMove(from,to,pct=.5,forced=false){
  const p=v188PlayerFaction(),cost=forced?2:1;if(cityOwner(from)!==p||cityOwner(to)!==p)return alert('自国都市間でのみ再配置できます。');
  if(v194Remaining(from)<cost)return alert(`${v194PoolLabel(from)}の行動力が不足しています（残り${v194Remaining(from)}／必要${cost}）。`);
  const path=v188Path(from,to,p);if(!path)return alert('味方・同盟街道で接続していません。');const available=Math.max(0,v173Army(from)-3000),amount=Math.floor(available*Math.max(.1,Math.min(.9,pct)));
  if(amount<4000)return alert('移動できる兵力が不足しています。');const m=v178OrderReinforcement(from,to,p,amount,path,forced?'プレイヤー強行軍':'プレイヤー再配置');if(!m)return alert('再配置命令を出せませんでした。');
  const g=v194GroupForCity(from);if(g)m.theatre=g.id;if(forced){m.forcedMarch=true;m.arrivalOrgPenalty=15;m.due=S.t+v194TravelWeeks(path,true)}v194Spend(from,cost,forced?'強行軍':'兵力再配置');v196Mark('move');v191Autosave();
  log(`【命令】${CITY_DATA[from].name}から${CITY_DATA[to].name}へ${(amount/10000).toFixed(1)}万人を${forced?'強行軍':'再配置'}。行動力${cost}消費。`);renderTop();renderSide();return m;
}
v188MoveTroops=function(from,to,pct=.5){return v194IssueMove(from,to,pct,false)};

// 強行軍フラグを実際の行軍速度へ反映。
v178ProcessMoves=function(){
  const st=v178EnsureStrategy();
  for(const m of [...st.moves]){
    if(m.departWeek>=S.t)continue;let current=m.path[m.index],blocked=!v173AreAllied(cityOwner(current),m.faction);
    if(blocked)current=m.path.slice(0,m.index+1).reverse().find(id=>cityOwner(id)===m.faction);
    if(current&&!blocked){let steps=0,maxSteps=m.forcedMarch?4:2;while(m.index<m.path.length-1&&steps<maxSteps){const next=m.path[m.index+1];if(!CITY_DATA[current].neighbors.includes(next)||!v173AreAllied(cityOwner(next),m.faction)||(next===m.to&&cityOwner(next)!==m.faction)){blocked=true;break}const sea=v173IsSea(current,next);if(sea&&steps>0)break;m.index++;current=next;steps+=sea?2:1}}
    const arrived=!blocked&&m.index===m.path.length-1;
    if(arrived||blocked){
      if(current&&cityOwner(current)!==m.faction)current=m.path.slice(0,m.index+1).reverse().find(id=>cityOwner(id)===m.faction);
      if(current){v178AddMix(current,m.faction,m.mix);for(const h of m.leaders||[])st.officers[h]=current;if(arrived&&m.arrivalOrgPenalty&&v188CampaignEnabled()&&m.faction===v188PlayerFaction()){const cs=v193CityState(current,m.faction);cs.org=v193Clamp(cs.org-m.arrivalOrgPenalty)}v178Event(arrived?'arrival':'blocked',`${m.kind==='officer'?(m.leaders||[]).map(id=>v178Heroes().find(h=>h.id===id)?.name||id).join('・'):m.faction+'の'+(m.amount/10000).toFixed(1)+'万人'}が${CITY_DATA[current].name}へ${arrived?'到着':'退避（街道遮断）'}`,{faction:m.faction,city:current,amount:m.amount,moveId:m.id,officers:m.leaders||[]})}
      else{for(const h of m.leaders||[])st.officers[h]=null;v178Event('blocked',`${m.faction}の増援は退路を失い戦線離脱。`,{faction:m.faction,amount:m.amount,moveId:m.id,officers:m.leaders||[]})}st.moves.splice(st.moves.indexOf(m),1);
    }else m.due=S.t+v194TravelWeeks(m.path.slice(m.index),!!m.forcedMarch);
  }
};

// 方面軍の補充命令も1隊派遣につきAP1を消費。
function v194Gather(g,to,desired,maxActions=2){
  const p=v188PlayerFaction(),st=v178EnsureStrategy(),paths=v178Paths(to,p),sup=v178Supply(p),fronts=new Set(v178Fronts(p));let need=Math.max(0,desired-v173Army(to)-st.moves.filter(m=>m.faction===p&&m.to===to).reduce((n,m)=>n+m.amount,0)),count=0;
  const donors=g.cities.filter(id=>id!==to&&paths.has(id)&&sup.supplied.has(id)).sort((a,b)=>paths.get(a).length-paths.get(b).length);
  for(const id of donors){if(need<4000||count>=maxActions||v194Remaining(id)<1)break;const reserve=fronts.has(id)?Math.max(18000,v178DesiredArmy(id,p)):id===sup.capital?16000:SUPPLY_HUBS[id]?8000:5000,available=Math.max(0,v173Army(id)-reserve),amount=Math.floor(Math.min(need,available,v173Army(id)*.6));if(amount<4000)continue;
    const m=v178OrderReinforcement(id,to,p,amount,paths.get(id).slice().reverse(),g.name+'・'+V192_MODES[g.mode]);if(m){m.theatre=g.id;v194Spend(id,1,`${g.name}増援：${CITY_DATA[id].name}→${CITY_DATA[to].name}`);count++;need-=m.amount}
  }return count;
}

// 方面軍はそれぞれ2APを持つ。手動操作と自動命令で同じAPを共有。
v192RunOrders=function(){
  if(!v188CampaignEnabled()||S.v188.ending)return [];const x=v192State(),p=x.player;v188ResetActions();if(x.lastRun===S.t)return x.notes;x.lastRun=S.t;x.notes=[];const claimed=new Set(),groups=[...x.groups];if(groups.length){const offset=(S.t-1)%groups.length;groups.push(...groups.splice(0,offset))}
  for(const g of groups){if(['stop','manual'].includes(g.mode))continue;let messages=[],actions=0,touched=[];g.lastWeek=S.t;
    const rem=()=>v194RemainingByKey('g:'+g.id);
    if(!g.cities.length)messages.push('担当都市がありません。都市を割り当ててください。');
    else if(rem()<=0)messages.push('今週の行動力を使い切っているため待機。');
    else if(['defend','refill'].includes(g.mode)){
      if(!g.cities.includes(g.target)&&cityOwner(g.target)===p)messages.push('目標都市をこの方面軍の担当に割り当ててください。');
      else if(cityOwner(g.target)!==p)messages.push('目標が自国都市ではないため待機。目標を変更してください。');
      else{const desired=g.mode==='defend'?Math.max(30000,v178DesiredArmy(g.target,p)):Math.min(60000,v173Economy(g.target).supplyCapacity||60000),moves=v194Gather(g,g.target,desired,rem());actions+=moves;messages.push(moves?`${CITY_DATA[g.target].name}へ増援${moves}隊を派遣。`:`${CITY_DATA[g.target].name}で待機。必要兵力を確保済み、行軍中、または余剰兵力なし。`)}
    }else if(cityOwner(g.target)===p){g.mode='defend';messages.push('目標を確保済み。防衛命令へ切り替えました。');}
    else if(v173AreAllied(p,cityOwner(g.target))||!v178AtWar(p,cityOwner(g.target)))messages.push('目標国と交戦していないため待機。自動宣戦は行いません。');
    else{
      while(rem()>0&&actions<2){
        const d=v192Distances(g.target),candidates=[];
        for(const from of g.cities)if(!claimed.has(from)&&d.has(from)&&cityOwner(from)===p)for(const to of CITY_DATA[from].neighbors)if(!claimed.has(to)&&v178CanAttackCity(from,to)&&d.has(to)&&d.get(to)<d.get(from)){const pred=v191Predict(from,to,.6,'assault');if(pred)candidates.push({from,to,distance:d.get(to),pred})}
        candidates.sort((a,b)=>a.distance-b.distance||b.pred.ratio-a.pred.ratio);const c=candidates[0];
        if(!c){messages.push('担当都市から目標へ進める交戦経路がありません。前線都市を割り当ててください。');break}
        if(c.pred.army<11000||c.pred.reserve<8000||c.pred.ratio<1.15||!v177IsSupplied(c.from,p)){
          const desired=Math.max(35000,v178DesiredArmy(c.from,p)),moves=v194Gather(g,c.from,desired,rem());actions+=moves;messages.push(moves?`${CITY_DATA[c.from].name}へ増援${moves}隊を集中。`:`${CITY_DATA[c.from].name}で戦力・補給の確保待ち（戦力比 ${c.pred.ratio.toFixed(2)}）。`);break;
        }
        const check=v191TacticEligibility(c.from,c.to,'assault');if(!check.ok){messages.push(check.reason);break}
        const r=v177ResolveSimBattle(c.from,c.to,{commit:.6,tactic:'assault'});if(!r){messages.push('攻撃条件が変わったため待機。');break}
        v194Spend(c.from,1,`${g.name}自動進撃：${CITY_DATA[c.from].name}→${CITY_DATA[c.to].name}`);actions++;touched.push(c.from,c.to);r.playerAction=true;r.theatre=g.name;r.prediction=c.pred;r.tactic='assault';v191State().lastBattle=r;v191EvaluateMissions();messages.push(`${CITY_DATA[c.from].name} → ${CITY_DATA[c.to].name}：${r.captured?'都市制圧':r.breakthrough?'防衛線突破':'攻撃失敗'}。`);
        if(r.captured&&!g.cities.includes(c.to))g.cities.push(c.to);if(r.captured&&c.to===g.target){g.mode='defend';messages.push('目標達成、防衛へ移行。');break}
        if(!r.breakthrough)break;const after=v191Predict(c.from,c.to,.6,'assault');if(!after||after.ratio<1.08||v173Army(c.from)<11000)break;
      }
    }
    for(const id of touched)claimed.add(id);for(const id of g.cities)if(v178Fronts(p).includes(id))claimed.add(id);g.status=messages.join(' ')||'待機。';x.notes.push({id:g.id,name:g.name,week:S.t,message:g.status});log(`【方面軍】${g.name}：${g.status}`);
  }return x.notes;
};

<script>

// 現行の各国戦役は都市駐留軍を作戦単位として管理しているため、1都市の駐留軍＝1作戦部隊として扱う。
function v197State(){
 const p=v188PlayerFaction();
 if(!S.v197||S.v197.player!==p)S.v197={version:197,player:p,week:S.t,battle:{},move:{},notes:[]};
 const x=S.v197;x.battle=x.battle||{};x.move=x.move||{};x.notes=Array.isArray(x.notes)?x.notes:[];
 if(x.week!==S.t){x.week=S.t;x.battle={};x.move={};x.notes=[]}
 return x;
}
function v197BattleUsed(city){return !!v197State().battle[city]}
function v197CanBattle(city){return CITY_DATA[city]&&cityOwner(city)===v188PlayerFaction()&&!v197BattleUsed(city)}
function v197SpendBattle(city,reason='戦闘行動'){
 if(!CITY_DATA[city]||cityOwner(city)!==v188PlayerFaction())return false;const x=v197State();
 if(x.battle[city])return false;x.battle[city]={week:S.t,reason};x.notes.unshift({week:S.t,kind:'battle',city,reason});x.notes=x.notes.slice(0,50);return true;

function v197Gather(g,to,desired,maxMoves=2){
 const p=v188PlayerFaction(),st=v178EnsureStrategy(),paths=v178Paths(to,p),sup=v178Supply(p),fronts=new Set(v178Fronts(p));let need=Math.max(0,desired-v173Army(to)-st.moves.filter(m=>m.faction===p&&m.to===to).reduce((n,m)=>n+m.amount,0)),count=0;
 const donors=g.cities.filter(id=>id!==to&&paths.has(id)&&sup.supplied.has(id)&&!v197MoveUsed(id)).sort((a,b)=>paths.get(a).length-paths.get(b).length);
 for(const id of donors){if(need<4000||count>=maxMoves)break;const reserve=fronts.has(id)?Math.max(18000,v178DesiredArmy(id,p)):id===sup.capital?16000:SUPPLY_HUBS[id]?8000:5000,available=Math.max(0,v173Army(id)-reserve),amount=Math.floor(Math.min(need,available,v173Army(id)*.6));if(amount<4000)continue;
  const path=paths.get(id).slice().reverse(),same=v202SameLandArea(id,to);
  if(same){const mix=v178TakeMix(id,p,amount);v178AddMix(to,p,mix);v197MarkMove(id,`${g.name}県内集結`);v197MarkMove(to,`${g.name}増援受入`);count++;need-=amount}
  else{const m=v178OrderReinforcement(id,to,p,amount,path,g.name+'・'+V192_MODES[g.mode]);if(m){m.theatre=g.id;v197MarkMove(id,`${g.name}増援`);count++;need-=m.amount}}
 }return count;
}
v192RunOrders=function(){
 if(!v188CampaignEnabled()||S.v188.ending)return [];const x=v192State(),p=x.player;v197State();if(x.lastRun===S.t)return x.notes;x.lastRun=S.t;x.notes=[];const claimed=new Set(),groups=[...x.groups];if(groups.length){const offset=(S.t-1)%groups.length;groups.push(...groups.splice(0,offset))}
 for(const g of groups){if(['stop','manual'].includes(g.mode))continue;let messages=[],attacks=0,touched=[];g.lastWeek=S.t;
  if(!g.cities.length)messages.push('担当都市がありません。都市を割り当ててください。');
  else if(['defend','refill'].includes(g.mode)){
   if(!g.cities.includes(g.target)&&cityOwner(g.target)===p)messages.push('目標都市をこの方面軍の担当に割り当ててください。');
   else if(cityOwner(g.target)!==p)messages.push('目標が自国都市ではないため待機。目標を変更してください。');
   else{const desired=g.mode==='defend'?Math.max(30000,v178DesiredArmy(g.target,p)):Math.min(60000,v173Economy(g.target).supplyCapacity||60000),moves=v197Gather(g,g.target,desired,2);messages.push(moves?`${CITY_DATA[g.target].name}へ増援${moves}隊を派遣。戦闘行動は温存。`:`${CITY_DATA[g.target].name}で待機。必要兵力を確保済み、行軍中、または余剰兵力なし。`)}
  }else if(cityOwner(g.target)===p){g.mode='defend';messages.push('目標を確保済み。防衛命令へ切り替えました。');}
  else if(v173AreAllied(p,cityOwner(g.target))||!v178AtWar(p,cityOwner(g.target)))messages.push('目標国と交戦していないため待機。自動宣戦は行いません。');
  else{
   const d=v192Distances(g.target);for(let guard=0;guard<3;guard++){
    const candidates=[];for(const from of g.cities)if(!claimed.has(from)&&v197CanBattle(from)&&d.has(from)&&cityOwner(from)===p)for(const to of CITY_DATA[from].neighbors)if(!claimed.has(to)&&v178CanAttackCity(from,to)&&d.has(to)&&d.get(to)<d.get(from)){const pred=v191Predict(from,to,.6,'assault');if(pred)candidates.push({from,to,distance:d.get(to),pred})}
    candidates.sort((a,b)=>a.distance-b.distance||b.pred.ratio-a.pred.ratio);const c=candidates[0];if(!c){if(!attacks)messages.push('今週戦闘可能な担当部隊から目標へ進める経路がありません。');break}
    if(c.pred.army<11000||c.pred.reserve<8000||c.pred.ratio<1.15||!v177IsSupplied(c.from,p)){const desired=Math.max(35000,v178DesiredArmy(c.from,p)),moves=v197Gather(g,c.from,desired,2);messages.push(moves?`${CITY_DATA[c.from].name}へ増援${moves}隊を集中。`:`${CITY_DATA[c.from].name}で戦力・補給の確保待ち（戦力比 ${c.pred.ratio.toFixed(2)}）。`);break}

   }
  }

 }return x.notes;

<script>
(function(){

function v198TransferExact(from,to,amount,reason='一括再配置'){
 const p=v188PlayerFaction();amount=Math.max(0,Math.floor(amount/1000)*1000);
 if(!v198CanSource(from,to))return {ok:false,reason:'移動不可'};
 const army=v173Army(from);if(amount<=0||amount>army)return {ok:false,reason:'兵力不足'};
 const path=v198Path(from,to),same=v202SameLandArea(from,to);
 if(same){
  const mix=v178TakeMix(from,p,amount);v178AddMix(to,p,mix);v197MarkMove(from,reason+'・県内即時');
  if(v197BattleUsed(from)&&!v197BattleUsed(to))v197SpendBattle(to,'行動済み部隊を受入');
  v178Event('move',`${p}：${CITY_DATA[from].name} → ${CITY_DATA[to].name}へ${(amount/10000).toFixed(1)}万人を即時再配置`,{faction:p,from,to,amount});
  return {ok:true,immediate:true,amount};
 }
 if(amount<4000)return {ok:false,reason:'行軍・海上輸送は0.4万人以上'};
 const m=v178OrderReinforcement(from,to,p,amount,path,reason);if(!m)return {ok:false,reason:'行軍命令失敗'};
 v197MarkMove(from,reason);return {ok:true,immediate:false,amount,move:m};
}
function v198TargetOptions(target){
 return v198Owned().sort((a,b)=>CITY_DATA[a].name.localeCompare(CITY_DATA[b].name,'ja')).map(id=>`<option value="${id}" ${id===target?'selected':''}>${CITY_DATA[id].name} · ${(v173Army(id)/10000).toFixed(1)}万${v178Fronts(v188PlayerFaction()).includes(id)?' · 前線':''}</option>`).join('');
}

 const army=v173Army(id),path=v198Path(id,to),same=v202SameLandArea(id,to),busy=v197MoveUsed(id),can=v198CanSource(id,to),dist=path?path.length-1:0;
 return `<div class="v198Source ${can?'':'disabled'}" data-city="${id}">
 <input class="v198Pick" type="checkbox" ${can?'':'disabled'}>
 <span><b>${CITY_DATA[id].name} · ${(army/10000).toFixed(1)}万</b><small>${fronts.has(id)?'前線':'後方'} ／ ${same?'同県・即時':path?`街道${dist}区間`:'経路なし'}${busy?' ／ 今週再配置済':''}${v197BattleUsed(id)?' ／ 戦闘済':''}</small></span>
 <input class="v198Amount" type="number" min="0" max="${(army/10000).toFixed(1)}" step="0.1" value="0" ${can?'':'disabled'}>

}
window.v198ShowRedeploy=function(preferredTarget=null){
 if(preferredTarget&&CITY_DATA[preferredTarget]&&cityOwner(preferredTarget)===v188PlayerFaction())v198State().target=preferredTarget;
 if(!v188CampaignEnabled())return;
 const x=v198State(),p=v188PlayerFaction(),owned=v198Owned(),fronts=new Set(v178Fronts(p));let to=x.target&&cityOwner(x.target)===p?x.target:null;
 if(!to)to=[...fronts][0]||owned[0];x.target=to;

 v191Present(`<div class="panel">${v191Back()}<div class="frontTag">MASS REDEPLOYMENT / 一括再配置</div><h2>前線へ増援を集める</h2>
 <p class="frontInfo">① 集結先を選ぶ → ② 目標兵力を入力 → ③ 自動で集める。県内の陸路は即時到着。県外や離島への兵は行軍・海上輸送で、週を進めると到着します。</p>
 <div class="v198Grid"><div>総兵力<b>${(total/10000).toFixed(1)}万</b></div><div>集結先兵力<b>${(v173Army(to)/10000).toFixed(1)}万</b></div><div>到着予定<b>${(incoming/10000).toFixed(1)}万</b></div></div>

 <details class="v199More"><summary>派遣元・人数を自分で指定する</summary> <div class="v198Preset"><button onclick="v198Preset('rear25')">後方から25%</button><button onclick="v198Preset('rear50')">後方から50%</button><button onclick="v198Preset('surplus')">余剰兵力だけ</button><button onclick="v198Preset('same')">県内陸路だけ</button><button onclick="v198Preset('clear')">全解除</button></div>

 <button class="primary" style="width:100%;min-height:50px;margin-top:9px" onclick="v198ExecuteManual()">選択した兵力を一括再配置</button>
</details>
 </div>`);
 setTimeout(v198UpdateSummary,0);
};

window.v198UpdateSummary=function(){

};
window.v198Preset=function(kind){
 const to=v198State().target,fronts=new Set(v178Fronts(v188PlayerFaction()));
 for(const row of document.querySelectorAll('.v198Source')){const id=row.dataset.city,cb=row.querySelector('.v198Pick'),inp=row.querySelector('.v198Amount');if(!cb||cb.disabled)continue;
  const army=v173Army(id),same=v202SameLandArea(id,to),isFront=fronts.has(id);let amount=0,select=false;
  if(kind==='rear25'&&!isFront){select=true;amount=army*.25}else if(kind==='rear50'&&!isFront){select=true;amount=army*.5}
  else if(kind==='surplus'){amount=Math.max(0,army-(isFront?20000:5000));select=amount>=1000}
  else if(kind==='same'&&same){amount=Math.max(0,army-(isFront?20000:5000));select=amount>=1000}

 if(!orders.length)return alert('派遣元と兵力を指定してください。');
 let moved=0,total=0,errors=[];for(const o of orders){const r=v198TransferExact(o.from,to,o.amount,'一括再配置');if(r.ok){moved++;total+=r.amount}else errors.push(`${CITY_DATA[o.from].name}：${r.reason}`)}
 if(moved){v198State().last={week:S.t,to,moved,total};log(`【一括再配置】${moved}都市から${CITY_DATA[to].name}へ計${(total/10000).toFixed(1)}万人を再配置。`);v178ClearCaches();v191Autosave();}
 if(errors.length)alert(`一部の命令を実行できませんでした。\n${errors.join('\n')}`);v198ShowRedeploy();
};
window.v198AutoGather=function(){
 const to=v198State().target,p=v188PlayerFaction(),fronts=new Set(v178Fronts(p));
 const desired=Math.max(0,Number(document.getElementById('v198Desired')?.value||0)*10000),frontReserve=Math.max(0,Number(document.getElementById('v198FrontReserve')?.value||0)*10000),rearReserve=Math.max(0,Number(document.getElementById('v198RearReserve')?.value||0)*10000),scope=document.getElementById('v198Scope')?.value||'all';
 let need=Math.max(0,desired-v173Army(to)-v198Incoming(to));if(need<1000)return alert('すでに目標兵力を満たしています。');

 init(){if(this.ctx)return true;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=.035;this.master.connect(this.ctx.destination);const filter=this.ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=155;this.drone=this.ctx.createGain();this.drone.gain.value=.0001;filter.connect(this.drone);this.drone.connect(this.master);for(const [type,freq] of [['sawtooth',55],['sine',55.36]]){const o=this.ctx.createOscillator();o.type=type;o.frequency.value=freq;o.connect(filter);o.start()}this.timer=setInterval(()=>{if(this.wanted&&soundEnabled()&&!document.hidden&&Math.random()<.22)this.chirp()},4200);return true}catch(e){console.warn('Ambient audio unavailable',e);return false}},
 start(){this.wanted=true;if(!this.init())return;if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});this.sync()},
 sync(){if(!this.ctx||!this.drone)return;const on=this.wanted&&soundEnabled()&&!document.hidden;this.drone.gain.setTargetAtTime(on?1:.0001,this.ctx.currentTime,on?2.8:.6)},
 chirp(){if(!this.ctx||this.ctx.state!=='running'||!soundEnabled())return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(1380,t);o.frequency.linearRampToValueAtTime(1760,t+.055);g.gain.setValueAtTime(.011,t);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.14)}
};
window.AmbienceBGM=AmbienceBGM;

 callerEl.textContent=String(caller||'司令部 緊急通信').toUpperCase();msgEl.textContent=String(message||'').replace(/^第\d+週：/,'');overlay.classList.add('active');AmbienceBGM.chirp();

 const visible=new Set();if(isObserver())return new Set(Object.keys(CITY_DATA));const p=playerFaction();

 return visible;

 svg.querySelectorAll('.cityNode').forEach(node=>{const ids=(node.dataset.cities||node.dataset.city||'').split(',').filter(Boolean);node.classList.toggle('fog-obscured',ids.length>0&&ids.every(id=>!visible.has(id)))});

if(typeof window.log==='function'&&!window.log.__v205Radio){const baseLog=window.log;const wrapped=function(text,...args){const s=String(text??'');let caller='',message='',critical=false;if(s.includes('【スキル発動】')){const m=s.match(/【スキル発動】(.+?)の『(.+?)』/);if(m){caller=m[1]+' [固有指揮]';message='『'+m[2]+'』発動！'}}else if(s.includes('【深刻な警告】')){caller='司令部 緊急通信';message=s.replace(/【.+?】/,'');critical=true}else if(/【作戦成功】|【作戦失敗】/.test(s)){caller='統合作戦本部';message=s.replace(/【.+?】/,'');critical=true}else if(s.includes('【戦略会議】')){caller='戦略会議';message=s.replace('【戦略会議】','')}else if(s.includes('【外交】')){caller='外務局';message=s.replace('【外交】','')}

mountSpeedControls();requestAnimationFrame(applyFog);
// Audio is only activated by a real user gesture; this works on iOS Safari.

<script id="v207OperationIntroController">

<script id="v212DesignController">
const V212UI=(()=>{
 'use strict';
 const esc=V211Comfort.esc;
 const palette={'東海帝国':'#315b78','関東連邦':'#854b57','関西連合':'#695787','中国':'#867043','死国':'#9a7c2e','九州王国':'#986344','北海道帝国':'#397d91','東北共和国':'#4b7363','女帝国':'#8b537d','沖縄諸国':'#417f78'};
 function color(f){return palette[f]||factions[f]?.c||'#596a78'}
 function crest(label,kind='nation'){return `<span class="v212Crest ${kind}" aria-hidden="true"><svg viewBox="0 0 40 46"><path d="M20 2L37 10V29L20 43L3 29V10Z"/><path d="M10 16H30M12 23H28"/></svg><b>${esc(label)}</b></span>`}
 function chrome(){
  const host=document.querySelector('.toprow>div:last-child');if(!host)return;
  if(!document.getElementById('v212MenuButton')){const b=document.createElement('button');b.id='v212MenuButton';b.type='button';b.textContent='メニュー';b.setAttribute('aria-label','保存・設定・戦況メニュー');b.onclick=openMenu;host.appendChild(b)}
  const campaign=v188CampaignEnabled();document.body.classList.toggle('v212Campaign',campaign);
  if(campaign){const f=v188PlayerFaction();document.body.style.setProperty('--v212Faction',color(f));for(const chip of document.querySelectorAll('#chips .chip'))chip.classList.toggle('v212ExtraChip',!/^週\s|^都市\s|^拠点\s|^総兵力\s|^兵力\s/.test(chip.textContent.trim()))}
 }
 function openMenu(){
  let d=document.getElementById('v212Menu');if(!d){d=document.createElement('dialog');d.id='v212Menu';document.body.appendChild(d)}
  const tokai=v188CampaignEnabled()&&v188PlayerFaction()==='東海帝国',inPlay=document.getElementById('start').style.display==='none';
  const speed=document.querySelector('.v205TimeControlBar');speed?.remove();
  d.innerHTML=`<div class="v212DialogHead"><h2>戦略メニュー</h2><button type="button" onclick="document.getElementById('v212Menu').close()" aria-label="メニューを閉じる">×</button></div><div class="v212MenuGrid">${inPlay?`<button data-action="save">進行を保存</button><button data-action="report">戦況・週次報告</button><button data-action="export">セーブを書き出す</button><button data-action="details">地図の凡例・地域</button>${tokai?'<button class="v212GuardEntry" data-action="guard">宮地親衛隊</button><button class="v212MegaEntry" data-action="mega">メガシティ</button>':''}`:''}<button data-action="settings">音・演出設定</button>${inPlay?'<button data-action="manual">遊び方</button><button data-action="world">世界観</button><button data-action="title">タイトルへ</button>':''}</div>${inPlay?'<div class="v212Time"><b>週の進め方</b><p>1xは手動。2x・5xは週を自動で進めます。</p><div id="v212SpeedHost"></div></div>':''}`;
  if(speed){if(inPlay)d.querySelector('#v212SpeedHost').appendChild(speed);else document.querySelector('.toprow>div:last-child').prepend(speed)}
  d.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{d.close();const a=b.dataset.action;if(a==='settings')return V204Feedback.openSettings();if(a==='save')return saveGame();if(a==='export')return v188CampaignEnabled()?v196Export():saveGame();if(a==='report')return v188CampaignEnabled()?v191ShowWeekReport():v177ShowSimulationDashboard();if(a==='guard')return v210ShowGuard();if(a==='mega')return v212ShowMega();if(a==='manual')return showManual();if(a==='world')return showWorld();if(a==='details'){const det=document.querySelector('.v196MapDetails');document.body.classList.toggle('v212DetailsOpen');if(det)det.open=document.body.classList.contains('v212DetailsOpen');return}if(a==='title'){setGameSpeed(1);v188RestoreStart();document.getElementById('start').style.display='block'}});
  d.showModal();
 }
 function dock(id){
  if(!v188CampaignEnabled()||innerWidth<=760)return;
  if(!id){side.innerHTML=`<div class="panel v212MapDock"><div class="frontTag">戦略地図</div><h2>前線を選んで指揮</h2><p>都市を選ぶと、移動・攻撃と部隊の状態を確認できます。</p><button class="primary" onclick="v191FocusFront()">前線を見る</button><button onclick="showHQ()">指令部を開く</button></div>`;return}
  const n=CITY_DATA[id].name,st=v193CityState(id,v188PlayerFaction()),guards=v188PlayerFaction()==='東海帝国'?Object.values(V210Tokai.state().guard.teams).filter(t=>t.city===id&&!t.target):[];
  side.innerHTML=`<div class="panel v212MapDock"><div class="frontTag">選択中の作戦部隊</div><div class="v212DockName">${crest(n.slice(0,1))}<div><h2>${esc(n)}</h2><b>${(v173Army(id)/10000).toFixed(1)}万人</b></div></div><div class="v212Readiness"><span>組織力 <b>${Math.round(st.org)}</b></span><span>防衛度 <b>${Math.round(st.defense)}</b></span><span>補給 <b>${v177IsSupplied(id,v188PlayerFaction())?'接続':'断絶'}</b></span></div>${guards.length?`<p class="gold">親衛隊 ${guards.length}隊駐留 · 投入可能 ${guards.filter(t=>t.readyWeek<=S.t).length}隊</p>`:''}<p>地図の命令カードから行き先を指定できます。</p><button onclick="v200Details()">部隊・都市の詳細</button>${guards.length?'<button onclick="v210ShowGuard()">親衛隊を指揮</button>':''}<button onclick="showHQ()">指令部</button></div>`;
 }
 function battle(r){
  const el=document.getElementById('v211Summary');if(!el)return;
  el.classList.add('v212BattleSummary');const before=Math.max(0,Math.min(100,r.defenseBefore??r.prediction?.cityDefense??100)),after=Math.max(0,Math.min(100,r.defenseAfter??before));
  const box=document.createElement('div');box.className='v212BattleFeedback';box.innerHTML=`<div><span>${r.captured?'都市を占領':r.breakthrough?'防衛線を突破・攻略継続':r.tactic==='feint'?'牽制完了・占領なし':'敵都市の防衛度'}</span><b>${Math.round(before)} → ${Math.round(after)}</b></div><div class="v212DefenseTrack"><i style="width:${after}%"></i><em style="left:${after}%;width:${Math.max(0,before-after)}%"></em></div>${r.prediction?.aHero?.names?.some(n=>n.startsWith('親衛'))?`<small class="gold">${esc(r.prediction.aHero.names.filter(n=>n.startsWith('親衛')).join('・'))}</small>`:''}`;
  el.firstElementChild.appendChild(box);el.classList.toggle('v212Animate',V211Comfort.mode()!=='off'&&!matchMedia('(prefers-reduced-motion:reduce)').matches);
 }
 function titleModes(){
  const st=document.getElementById('start');st.classList.add('setupMode');st.querySelector('.startbox').innerHTML=`<div class="v188SelectHead"><button onclick="v188RestoreStart()">← タイトル</button><div class="titleStamp">新しい戦役</div><h1>戦い方を選ぶ</h1></div><div class="v212ModeGrid"><button class="titleBtn primary" onclick="v196ChooseMode('short')"><b>20週戦役</b><small>はじめての方に。東海・関東の短期戦。</small></button><button class="titleBtn" onclick="v196ChooseMode('standard')"><b>各国戦役</b><small>十の国から選び、同盟と外交で全国制覇。</small></button><button class="titleBtn" onclick="v196ChooseMode('free')"><b>フリーモード</b><small>初期同盟・交戦関係を自由に設定。</small></button><button class="titleBtn simStart" onclick="v203ShowSimulationSetup()"><b>AI対戦・観戦</b><small>全十か国の戦争をカスタマイズして観戦。</small></button><details class="v196Legacy"><summary>自由配置・先遣作戦</summary><button onclick="startOdawara()">東海道先遣作戦</button><button onclick="showDeployment()">東海帝国を自由配置</button></details></div>`;st.scrollTop=0;
 }
 function titleContinue(){
  const st=document.getElementById('start');st.classList.add('setupMode');
  const saves=Object.entries(V196_MODES).map(([key,m])=>{let data=null;try{data=JSON.parse(safeStoreGet(m.key)||'null')}catch{}return{key,m,data}});
  st.querySelector('.startbox').innerHTML=`<div class="v188SelectHead"><button onclick="v188RestoreStart()">← タイトル</button><div class="titleStamp">作戦記録</div><h1>続きから</h1></div><div class="v212ModeGrid">${saves.map(({key,m,data})=>`<button class="titleBtn" ${data?'':'disabled'} onclick="v196Continue('${key}')"><b>${esc(m.name)}</b><small>${data?`${esc(data.v188?.playerFaction||'保存した戦役')} · 第${data.t}週`:'保存した戦役はありません'}</small></button>`).join('')}<button class="titleBtn" ${safeStoreGet('tokai_sim_v178')?'':'disabled'} onclick="v178ContinueSimulation()"><b>AI観戦を再開</b><small>保存した全勢力AI対戦</small></button><button class="titleBtn" onclick="v196PickImport()"><b>セーブを読み込む</b><small>書き出した作戦記録を開く</small></button>${safeStoreGet('tokai_v11')?'<button class="titleBtn" onclick="continueGame()"><b>旧・東海戦役を再開</b></button>':''}</div>`;st.scrollTop=0;
 }
 function filterGuards(){
  const query=(document.getElementById('v212GuardSearch')?.value||'').trim().toLowerCase(),status=document.getElementById('v212GuardFilter')?.value||'all';let count=0;
  for(const row of document.querySelectorAll('.v210GuardTeam')){const match=(!query||row.dataset.search.toLowerCase().includes(query))&&(status==='all'||row.dataset.state===status);row.hidden=!match;if(match)count++}
  const out=document.getElementById('v212GuardCount');if(out)out.textContent=count+'隊を表示';
 }
 document.body.classList.add('v212Design');
 const topBase=renderTop;renderTop=function(...args){const r=topBase.apply(this,args);chrome();return r};
 const selectBase=v200Select;v200Select=function(...args){const r=selectBase.apply(this,args);if(v191State().view==='map')dock(v200Selected());return r};
 const cancelBase=v200Cancel;v200Cancel=function(...args){const r=cancelBase.apply(this,args);dock(null);return r};
 const renderBase=v188Render;v188Render=function(...args){const r=renderBase.apply(this,args);if(['map','mapIdle'].includes(v191State().view))dock(v200Selected());return r};
 chrome();
 return{color,crest,chrome,openMenu,dock,battle,titleModes,titleContinue,filterGuards};
})();

window.V212UI=V212UI;

</script>
